<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Psi Residência</title>
<meta name="theme-color" content="#f6f5f9">
<meta name="color-scheme" content="light dark">
<style>
/* Layout: phone-first study app — sticky top bar, one reading column, bottom tab bar on phones/tablets portrait, side nav on wide screens.
   Motif: Rorschach inkblots. Fonts are bundled in ./fontes so everything works offline. */
@font-face{font-family:"DancingV";src:url("fontes/dancing-script-latin-wght-normal.woff2") format("woff2");font-weight:400 700;font-style:normal;font-display:swap}
@font-face{font-family:"InterV";src:url("fontes/inter-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"InterV";src:url("fontes/inter-latin-wght-italic.woff2") format("woff2");font-weight:100 900;font-style:italic;font-display:swap}
@font-face{font-family:"LiterataV";src:url("fontes/literata-latin-wght-normal.woff2") format("woff2");font-weight:200 900;font-style:normal;font-display:swap}
@font-face{font-family:"LiterataV";src:url("fontes/literata-latin-wght-italic.woff2") format("woff2");font-weight:200 900;font-style:italic;font-display:swap}
@font-face{font-family:"Atkinson";src:url("fontes/atkinson-hyperlegible-latin-400-normal.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Atkinson";src:url("fontes/atkinson-hyperlegible-latin-700-normal.woff2") format("woff2");font-weight:600 700;font-style:normal;font-display:swap}
@font-face{font-family:"Atkinson";src:url("fontes/atkinson-hyperlegible-latin-400-italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap}

:root{
  /* light (default) */
  --paper:#f6f5f9; --card:#ffffff; --ink:#1c1a26; --muted:#5f5b6e; --line:#e2e0ea;
  --accent:#0d7366; --accent-ink:#ffffff; --accent-soft:#ddf1ed; --love:#b8336a;
  --blot:#2a2347;
  --ok:#1b7f45; --ok-soft:#e0f3e7; --bad:#b93c0b; --bad-soft:#fcebe2; --warn:#8a5a00; --warn-soft:#fbf1d6;
  --shadow:0 1px 2px rgb(28 26 38 / .05),0 4px 14px rgb(28 26 38 / .05);
  --f-ui:"InterV",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-read:var(--f-ui);
  --fs:1;            /* text scale chosen in Ajustes */
  --lh:1.62;         /* reading line-height */
  --measure:70ch;    /* reading column width */
  --r:14px;
  --tap:44px;
  color-scheme:light;
}
:root[data-read="literata"]{--f-read:"LiterataV",Georgia,"Times New Roman",serif}
:root[data-read="atkinson"]{--f-read:"Atkinson","InterV",ui-sans-serif,system-ui,sans-serif}
:root[data-ui="atkinson"]{--f-ui:"Atkinson","InterV",ui-sans-serif,system-ui,sans-serif}

/* sepia: warm paper for long sessions */
:root[data-theme="sepia"]{
  --paper:#f3ead6; --card:#fbf6ea; --ink:#33291c; --muted:#6b5c46; --line:#e2d6bb;
  --accent:#2c6b5c; --accent-ink:#fffaf0; --accent-soft:#e3ecdc; --blot:#4a3a28; --love:#a3345c;
  --ok:#2f6f2f; --ok-soft:#e5efd6; --bad:#a1400f; --bad-soft:#f7e2d0; --warn:#7f5600; --warn-soft:#f6e6bd;
  --shadow:0 1px 2px rgb(60 40 10 / .06),0 4px 14px rgb(60 40 10 / .06); color-scheme:light}
/* dark: soft, never pure black/white */
:root[data-theme="dark"]{
  --paper:#15141b; --card:#1e1c26; --ink:#e9e7f0; --muted:#a7a3b6; --line:#2f2c3b;
  --accent:#5cc7b7; --accent-ink:#0a1f1c; --accent-soft:#16352f; --blot:#cfc8ee; --love:#f59bbb;
  --ok:#5bd68a; --ok-soft:#163222; --bad:#ff9466; --bad-soft:#3a2116; --warn:#f5c04a; --warn-soft:#352b12;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 6px 18px rgb(0 0 0 / .25); color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme]){
  --paper:#15141b; --card:#1e1c26; --ink:#e9e7f0; --muted:#a7a3b6; --line:#2f2c3b;
  --accent:#5cc7b7; --accent-ink:#0a1f1c; --accent-soft:#16352f; --blot:#cfc8ee; --love:#f59bbb;
  --ok:#5bd68a; --ok-soft:#163222; --bad:#ff9466; --bad-soft:#3a2116; --warn:#f5c04a; --warn-soft:#352b12;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 6px 18px rgb(0 0 0 / .25); color-scheme:dark}}
/* high contrast: works on top of any theme */
:root[data-contrast="high"]{--muted:color-mix(in srgb,var(--ink) 88%,var(--paper));--line:color-mix(in srgb,var(--ink) 50%,var(--paper))}
:root[data-contrast="high"] .opt,:root[data-contrast="high"] .card,:root[data-contrast="high"] .btn{border-width:2px}
:root[data-motion="off"] *{transition:none!important;animation:none!important;scroll-behavior:auto!important}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{background:var(--paper);color:var(--ink);margin:0}
body{font-family:var(--f-ui);font-size:calc(15px * var(--fs));line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0}
.tab-nums{font-variant-numeric:tabular-nums}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;z-index:80;background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:10px;font-weight:700;text-decoration:none}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 8px)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{white-space:nowrap;display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.015em;font-size:17px;background:none;border:0;padding:0;min-height:var(--tap)}
.brand canvas{width:34px;height:26px}
.xpbox{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
.lvl{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw;text-align:right}
.lvl b{color:var(--ink);font-weight:600}
.xpbar{width:90px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .5s}
.streak{display:flex;align-items:center;gap:4px;font-weight:700;font-size:14px;padding:4px 9px;border-radius:99px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.sync{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.sync.on{background:var(--ok)} .sync.busy{background:var(--warn)}
.iconbtn{width:var(--tap);height:var(--tap);display:grid;place-items:center;border-radius:12px;border:1px solid transparent;background:none;color:var(--muted);flex:none}
.iconbtn svg{width:21px;height:21px}
.iconbtn[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
:root[data-zen="1"] .lvl,:root[data-zen="1"] .xpbar,:root[data-zen="1"] .streak,:root[data-zen="1"] .zen-hide{display:none!important}

/* shell */
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:210px minmax(0,1fr);gap:32px;padding-block:24px 110px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);align-self:start;display:flex;flex-direction:column;gap:2px}
.navbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:0;background:none;text-align:left;color:var(--muted);font-weight:500;min-height:42px}
.navbtn svg{width:19px;height:19px;flex:none}
.navbtn[aria-current="page"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.navbtn .cnt{margin-left:auto;font-size:12px;background:var(--bad-soft);color:var(--bad);border-radius:99px;padding:0 7px;font-weight:600}
.navbtn .cnt.rev{background:var(--accent-soft);color:var(--accent)}
.side .sep{height:1px;background:var(--line);margin:8px 12px}
.side .kbd-tip{margin:14px 12px 0;font-size:12px;color:var(--muted);line-height:1.5}
main{min-width:0;max-width:880px;width:100%}
main:focus{outline:none}
.bottom{display:none}
.hdr-set{display:none}
@media (max-width:460px){.brand span{display:none}}
@media (max-width:380px){.lvl{display:none}}
/* tablets in portrait + phones: bottom tab bar */
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);padding-top:16px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  main{max-width:none}
  .side{display:none}
  .hdr-set{display:grid}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bottom .navbtn{flex:1;flex-direction:column;gap:3px;font-size:11px;padding:8px 2px;border-radius:0;justify-content:center;align-items:center;position:relative;min-height:56px}
  .bottom .navbtn[aria-current="page"]{box-shadow:none;background:none;color:var(--accent)}
  .bottom .navbtn .cnt{position:absolute;top:4px;right:calc(50% - 24px);margin:0;font-size:10px;padding:0 5px}
  .xpbar{display:none}
  body.kb .bottom{display:none} /* on-screen keyboard open */
}
/* tablets: centre a comfortable column */
@media (min-width:601px) and (max-width:900px){main{max-width:760px;margin:0 auto}}

/* generic */
.view{display:flex;flex-direction:column;gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.eyebrow{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.h1{font-size:clamp(24px,4.2vw,32px);font-weight:700;letter-spacing:-.025em}
.h2{font-size:calc(18.5px * var(--fs));font-weight:650;letter-spacing:-.015em}
.sub{color:var(--muted);max-width:62ch;margin:6px 0 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);text-align:center}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.danger.fill{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
@media (hover:hover){.btn:hover:not(:disabled){border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}.btn.pri:hover:not(:disabled){filter:brightness(1.06)}}
@media (pointer:coarse){.btn.sm{min-height:42px}}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--paper);border:1px solid var(--line);color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.sus{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:680px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.meter{height:8px;border-radius:9px;background:var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .m-ok{background:var(--ok)} .meter .m-bad{background:var(--bad)}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.empty{text-align:center;padding:34px 18px;color:var(--muted)}
.empty canvas{width:120px;height:90px;margin:0 auto 10px;display:block;opacity:.8}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center}
.ring{width:118px;height:118px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted);line-height:1.2}
.ring .lbl b{display:block;font-size:24px;color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:22px;letter-spacing:-.02em}
.kpi span{font-size:12.5px;color:var(--muted)}
@media (max-width:680px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:minmax(0,1fr)}.ring{margin:0 auto}}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:680px){.quick{grid-template-columns:minmax(0,1fr)}.qa{min-height:0!important}}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-height:118px}
@media (hover:hover){.qa:hover,.block:hover{border-color:var(--accent)}}
.qa .t{font-weight:700;font-size:16px}
.qa .d{font-size:13.5px;color:var(--muted)}
.qa .n{margin-top:auto;font-size:13.5px;font-weight:600;color:var(--accent)}

/* blocks */
.blocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:1100px){.blocks{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:680px){.blocks{grid-template-columns:minmax(0,1fr)}}
.block{display:flex;flex-direction:column;gap:12px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.block .top2{display:flex;gap:12px;align-items:center}
.block canvas{width:52px;height:40px;flex:none}
.block .nm{font-weight:700;font-size:16px}
.block .rg{font-size:12.5px;color:var(--muted)}
.exam{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.exam:first-child{border-top:0}
.exam .nm{font-weight:600}
.exam .meta{font-size:12.5px;color:var(--muted)}
.exam .acts{grid-row:1 / span 2;grid-column:2;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.exam .meter{grid-column:1}
@media (max-width:600px){.exam{grid-template-columns:minmax(0,1fr)}.exam .acts{grid-row:auto;grid-column:1;justify-content:flex-start}.exam .acts .btn{flex:1}}

.modeintro{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;padding:10px 14px;border-radius:12px;color:var(--ink)}
.modeintro .ic{font-size:18px;line-height:1.2}
/* guide */
.guide{display:flex;flex-direction:column;gap:12px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;counter-reset:st;margin:0;padding:0;list-style:none}
@media (max-width:760px){.steps{grid-template-columns:minmax(0,1fr)}}
.steps li{position:relative;padding:12px 14px 12px 50px;border:1px solid var(--line);border-radius:12px;background:var(--paper);font-size:13.5px;line-height:1.45;color:var(--muted)}
.steps li b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:2px}
.steps li::before{counter-increment:st;content:counter(st);position:absolute;left:14px;top:12px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--accent);color:var(--accent-ink)}
.side .helpbtn{margin:10px 0 0;width:100%;justify-content:flex-start}

/* ===== interface simples ===== */
.capa2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);align-items:end;gap:8px 18px;padding:22px 22px 0;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--love) 10%,var(--card)),var(--card) 55%,color-mix(in srgb,var(--accent) 8%,var(--card)))}
.capa-txt{align-self:center;padding-bottom:18px;min-width:0}
.capa-txt p{margin:0}
.capa-txt .c1{font-weight:750;font-size:clamp(22px,3vw,36px);line-height:1.15;letter-spacing:-.02em;color:var(--ink)}
.capa-txt .c2{font-family:"DancingV","Segoe Script","Brush Script MT",cursive;font-weight:600;font-size:clamp(24px,3.1vw,38px);line-height:1.15;color:var(--love);margin-top:10px}
.capa2 img{display:block;width:100%;height:auto;max-height:300px;object-fit:contain;object-position:right bottom}
@media (max-width:700px){.dbr{display:none}.capa2{grid-template-columns:minmax(0,1fr);padding:18px 16px 0;text-align:center}.capa-txt{padding-bottom:0}.capa2 img{max-height:210px;object-position:center bottom}}
.simple{gap:18px}
.hello .h1{margin-bottom:4px}
.cont{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 18px;border-radius:var(--r);border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card));color:inherit;font:inherit;cursor:pointer}
.cont .ic{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:15px;flex:none}
.cont b{display:block;font-size:16px}.cont span span{display:block;font-size:13.5px;color:var(--muted)}
.big2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:620px){.big2{grid-template-columns:minmax(0,1fr)}}
.bigc{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:20px;border-radius:var(--r);background:var(--card);border:2px solid var(--line);color:inherit;font:inherit;cursor:pointer;min-height:170px}
.bigc .ic{font-size:30px;line-height:1}
.bigc b{font-size:20px;letter-spacing:-.01em}
.bigc>span:not(.ic):not(.go){font-size:14.5px;color:var(--muted);line-height:1.45}
.bigc .go{margin-top:auto;font-weight:700;font-size:14.5px}
.bigc.m-estudo{border-color:var(--accent)}.bigc.m-estudo .go{color:var(--accent)}
.bigc.m-simulado{border-color:var(--warn)}.bigc.m-simulado .go{color:var(--warn)}
@media (max-width:620px){.bigc{min-height:0;padding:16px}}
@media (hover:hover){.bigc:hover,.cont:hover{transform:translateY(-1px)}}
.mini3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:620px){.mini3{grid-template-columns:minmax(0,1fr)}}
.mini3 button{display:flex;align-items:center;gap:8px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:inherit;font:inherit;font-weight:600;font-size:14.5px;text-align:left;cursor:pointer;min-height:48px}
.mini3 button b{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;padding:1px 8px;font-size:12.5px}
@media (hover:hover){.mini3 button:hover{border-color:var(--accent)}}
/* mode switch */
.modebox{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:var(--r);border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--card))}
.modebox.m-simulado{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--card))}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--paper);border-radius:12px;padding:4px}
.seg2 button{border:0;border-radius:9px;padding:11px 8px;font:inherit;font-weight:700;font-size:15.5px;background:none;color:var(--muted);cursor:pointer;min-height:46px}
.seg2 button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 1px 3px rgb(0 0 0 / .2)}
.m-simulado .seg2 button[aria-checked="true"]{background:var(--warn);color:var(--paper)}
.modedesc{margin:0 4px;font-size:14px;line-height:1.45}
.block .top2{justify-content:space-between}
.block .chev,.exam .chev{font-size:24px;color:var(--muted);line-height:1}
.card.exams{padding:6px 10px}
button.exam{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin:0;padding:14px 8px;background:none;border:0;border-top:1px solid var(--line);border-radius:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
button.exam:first-child{border-top:0}
@media (hover:hover){button.exam:hover{background:var(--paper)}}
.ex-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.ex-t .nm{font-weight:650;font-size:15.5px}
.ex-t .meta{font-size:13px;color:var(--muted)}
.ex-go{flex:none;font-weight:700;font-size:14px;padding:8px 12px;border-radius:10px;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.m-simulado ~ .exams .ex-go{background:var(--warn);color:var(--paper)}
.btn.wide{width:100%;justify-content:center;min-height:48px;white-space:normal;text-align:center}
details.more summary{cursor:pointer;font-weight:650}
/* quiz simples */
.modetag{font-weight:700;font-size:13.5px;padding:5px 12px;border-radius:99px;background:color-mix(in srgb,var(--accent) 16%,var(--card));border:1px solid var(--accent)}
.modetag.m-simulado{background:color-mix(in srgb,var(--warn) 18%,var(--card));border-color:var(--warn)}
.timer{font-size:17px}
.qprog{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.qprog b{color:var(--ink)}
.qprog .bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.qprog .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.modeintro.m-simulado{border:1px solid var(--warn);border-style:solid;background:color-mix(in srgb,var(--warn) 10%,var(--card))}
.modeintro.m-estudo{border:1px solid var(--accent);border-style:solid;background:color-mix(in srgb,var(--accent) 8%,var(--card))}
#qfav{font-size:18px;min-width:44px}#qfav.on{color:var(--warn)}
.notebox summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);padding:4px 0}
.notebox[open] summary{margin-bottom:6px}

/* quiz — reading typography scales with --fs / --lh / --measure */
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.qhead .pos{font-weight:700;margin-right:4px}
.timer{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,3vw,26px);display:flex;flex-direction:column;gap:18px}
.ctx{border-left:3px solid var(--line);padding:4px 0 4px 14px;font-family:var(--f-read);font-size:calc(15.5px * var(--fs));line-height:var(--lh);color:var(--muted);white-space:pre-wrap;max-width:var(--measure)}
.ctx summary{font-family:var(--f-ui);font-size:13.5px;font-weight:600;cursor:pointer;color:var(--accent);min-height:32px;display:flex;align-items:center}
.fig{margin:0;display:flex;justify-content:center}.fig img{max-width:100%;max-height:min(60vh,420px);height:auto;border-radius:8px;background:#fff;padding:6px;cursor:zoom-in}
.fig.zoom img{max-height:none;cursor:zoom-out}
.stem{font-family:var(--f-read);font-size:calc(17.5px * var(--fs));line-height:var(--lh);white-space:pre-wrap;max-width:var(--measure);letter-spacing:-.003em}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;font-family:var(--f-read);font-size:calc(16.5px * var(--fs));line-height:calc(var(--lh) - .08);min-height:var(--tap)}
.opt .L{font-family:var(--f-ui);font-weight:700;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line);font-size:14px}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--accent)}}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.opt.sel .L{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt .mark{font-family:var(--f-ui);font-size:12px;font-weight:700;margin-left:6px;white-space:nowrap}
.opt.right .mark{color:var(--ok)} .opt.wrong .mark{color:var(--bad)}
.opt.cut{opacity:.42;text-decoration:line-through}
.opt:disabled{cursor:default;color:inherit}
.opt .why{grid-column:2;font-family:var(--f-ui);font-size:calc(13.5px * var(--fs));line-height:1.5;color:var(--muted);margin-top:4px}
.qactions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qactions .grow{flex:1}
.hint{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:calc(14.5px * var(--fs))}
.hint b{color:var(--warn)}
.verdict{display:flex;gap:12px;align-items:center;font-weight:700;font-size:17px}
.verdict canvas{width:46px;height:36px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.expl{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:18px}
.expl .body{font-family:var(--f-read);font-size:calc(16.5px * var(--fs));line-height:var(--lh);max-width:var(--measure)}
.expl .body p{margin:0 0 .7em}
.expl .ref{font-size:13px;color:var(--muted)}
.expl .ref b{color:var(--ink)}
.flag{background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:calc(14px * var(--fs))}
.causes{display:flex;flex-wrap:wrap;gap:6px}
.causes button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13.5px;min-height:38px}
.causes button[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.note{width:100%;min-height:84px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;resize:vertical;font-family:var(--f-read);font-size:max(16px,calc(15.5px * var(--fs)));line-height:1.55}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.palette button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.palette .p-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.palette .p-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.palette .p-ans{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.palette .p-null{opacity:.4}
.palette .p-cur{outline:2px solid var(--ink);outline-offset:1px}
.navq{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.anul{background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--card);color:var(--ink)}
.keys{font-size:12.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
@media (pointer:coarse),(max-width:900px){.keys{display:none}}
/* phones/tablets: keep previous/next always within reach, above the tab bar */
@media (max-width:900px){
  .navq{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:15;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:8px;margin:0 -8px;border-radius:14px;flex-wrap:nowrap}
  .navq .btn{flex:1}
  body.kb .navq{bottom:8px}
}
@media (max-width:420px){.qcard{padding:14px;border-radius:12px}.opt{padding:12px;gap:10px}.qhead .chip:not(.acc):not(.sus){display:none}}

/* stats */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr) 72px;gap:10px;align-items:center;font-size:13.5px}
.bar .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
@media (max-width:600px){.bar{grid-template-columns:minmax(0,1fr) 72px}.bar .meter{grid-column:1 / -1;order:3}}
.days{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;align-items:end;height:90px}
.days i{display:block;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.daysl{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;font-size:10px;color:var(--muted);text-align:center}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.badge canvas{width:44px;height:34px}
.badge .t{font-weight:700;font-size:14px}
.badge .d{font-size:12.5px;color:var(--muted)}
.badge.off{opacity:.45}
.badge.off canvas{filter:grayscale(1)}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:13px 0;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;min-height:var(--tap)}
.li:first-child{border-top:0}
.li .s{font-family:var(--f-read);font-size:calc(15.5px * var(--fs));display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.li .m{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.li .r{grid-row:1 / span 2;grid-column:2;align-self:center}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px}
select.sel,input.inp{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;min-height:var(--tap);max-width:100%;font-size:max(16px,1em)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:600px){.filters .sel,.filters .btn{flex:1 1 100%}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:12px;font-weight:600;z-index:70;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;max-width:calc(100vw - 32px)}
@media (max-width:900px){.toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}}
.toast canvas{width:34px;height:26px}
.modal{position:fixed;inset:0;background:rgb(10 8 20 / .5);z-index:60;display:grid;place-items:center;padding:16px}
.modal .card{max-width:480px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:calc(100dvh - 32px);overflow:auto}
.journal{width:100%;min-height:280px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px;font-family:var(--f-read);font-size:max(16px,calc(16px * var(--fs)));line-height:var(--lh);resize:vertical}

/* ajustes */
.set{display:flex;flex-direction:column;gap:16px}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding-top:14px;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0;padding-top:0}
.setrow .lab{font-weight:600}
.setrow .help{grid-column:1;font-size:13px;color:var(--muted);margin-top:-4px}
.setrow .ctl{grid-row:1 / span 2;grid-column:2;justify-self:end}
@media (max-width:600px){.setrow{grid-template-columns:minmax(0,1fr)}.setrow .ctl{grid-row:auto;grid-column:1;justify-self:stretch}.setrow .ctl .seg{width:100%}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;padding:3px;background:var(--paper);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:8px;padding:6px 12px;min-height:36px;font-weight:600;font-size:13.5px;color:var(--muted);flex:1;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.switch{position:relative;width:52px;height:30px;border-radius:99px;border:1px solid var(--line);background:var(--line);flex:none;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgb(0 0 0 / .25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}
.preview{border:1px dashed var(--line);border-radius:12px;padding:14px 16px;font-family:var(--f-read);font-size:calc(17px * var(--fs));line-height:var(--lh);max-width:var(--measure)}
.dz{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.dz .h2{color:var(--bad)}
.undo{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.swatches{display:grid;grid-template-columns:repeat(4,minmax(64px,1fr));gap:8px}
.swatch{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid var(--line);border-radius:12px;padding:8px 6px;background:var(--card);min-width:0;font-size:12.5px;font-weight:600}
.swatch i{display:block;width:100%;max-width:56px;height:34px;border-radius:7px;border:1px solid rgb(0 0 0 / .12)}
.swatch[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}


/* map palette (works on all themes) */
:root{--c1:#0d7366;--c2:#6b4fc2;--c3:#b45309;--c4:#2563a8;--c5:#b23a5e;--c6:#3f7d2c}
:root[data-theme="dark"]{--c1:#5cc7b7;--c2:#b6a0f5;--c3:#f5b25b;--c4:#86b8f0;--c5:#f08fae;--c6:#97d47f}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--c1:#5cc7b7;--c2:#b6a0f5;--c3:#f5b25b;--c4:#86b8f0;--c5:#f08fae;--c6:#97d47f}}
:root[data-theme="sepia"]{--c1:#2c6b5c;--c2:#6a4c9c;--c3:#9a5a10;--c4:#2f5d8a;--c5:#9c3b55;--c6:#4c6e22}

/* tabs */
.tabs{display:flex;gap:4px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1;border:0;background:none;border-radius:9px;padding:9px 14px;min-height:40px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.topicchips{gap:6px}
@media (max-width:600px){.topicchips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}.topicchips::-webkit-scrollbar{display:none}.topicchips .btn{flex:none}}

/* mind map */
.mm-wrap{padding:clamp(14px,2.5vw,24px);overflow:hidden}
.mm{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,190px) minmax(0,1fr);gap:20px 46px;align-items:center}
.mm-lines{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:visible}
.mm-lines path{fill:none;stroke-width:2.2;opacity:.55}
.mm-col{display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
.mm-center{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:16px 14px;box-shadow:var(--shadow)}
.mm-center canvas{width:60px;height:46px}
.mm-center b{font-size:17px;line-height:1.25;letter-spacing:-.01em}
.mm-center span{font-size:12px;opacity:.85}
.mm-b{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;padding:12px 14px}
.mm-bh{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
.mm-bt{font-weight:700;color:var(--c);font-size:calc(15px * var(--fs))}
.mm-run{border:0;cursor:pointer;min-height:28px}
.mm-b ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-family:var(--f-read);font-size:calc(14.5px * var(--fs));line-height:1.5}
.mm-b li::marker{color:var(--c)}
@media (max-width:1100px){
  .mm{grid-template-columns:minmax(0,1fr);gap:14px}
  .mm-center{order:-1;flex-direction:row;justify-content:flex-start;text-align:left;border-radius:16px}
  .mm-center canvas{width:44px;height:34px}
  .mm-center span{margin-left:auto}
  .mm-lines{display:none}
  .mm-col{border-left:2px solid var(--line);margin-left:22px;padding-left:18px;gap:12px}
  .mm-col .mm-b{position:relative}
  .mm-col .mm-b::before{content:"";position:absolute;left:-20px;top:20px;width:18px;height:2px;background:var(--c)}
}

/* decks & flashcards */
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.deck{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-height:120px}
.deck:disabled{opacity:.55;cursor:default}
@media (hover:hover){.deck:hover:not(:disabled){border-color:var(--accent)}}
.deck .t{font-weight:700;font-size:16px}
.deck .d{font-size:13px;color:var(--muted)}
.deck .n{margin-top:auto;font-size:13px;color:var(--accent);font-weight:600}
.fc{perspective:1400px;outline:none;cursor:pointer}
.fc:focus-visible .fc-face{outline:3px solid var(--accent);outline-offset:2px}
.fc-in{display:grid;transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,30px);min-height:min(48vh,340px);display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.fc-face.back{transform:rotateY(180deg);border-top:5px solid var(--accent)}
.fc-src{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fc-q{font-family:var(--f-read);font-size:calc(20px * var(--fs));line-height:1.45;white-space:pre-wrap}
.fc-a{font-family:var(--f-read);font-size:calc(19px * var(--fs));line-height:1.5}
.fc-opts{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-family:var(--f-read);font-size:calc(15px * var(--fs));color:var(--muted)}
.fc-tip{margin-top:auto;font-size:12.5px;color:var(--muted)}
.fc-acts .btn{flex:1}
:root[data-motion="off"] .fc-in{transition:none}

/* highlighted analysis */
.keypt{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px;font-family:var(--f-read);font-size:calc(16.5px * var(--fs));line-height:var(--lh);max-width:var(--measure)}
.kp-l,.sec-l{display:block;font-family:var(--f-ui);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:4px}
.sec-l{color:var(--muted)}
.whys{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-family:var(--f-read);font-size:calc(15.5px * var(--fs));line-height:1.55;max-width:var(--measure)}
.whys li{border-left:3px solid var(--bad-soft);padding-left:10px}
.whys b{font-family:var(--f-ui);color:var(--bad)}
.hl{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:calc(14px * var(--fs))}
.hl.warn{background:var(--warn-soft);border-color:transparent}

<script>
"use strict";
/* ------------------------------------------------------------ utilities */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS_KEY = "psires.v1";
const DAY = 864e5;
const today = (t = Date.now()) => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function rich(t){ // tiny formatter: paragraphs, **bold**, *italic*
  return esc(t).split(/\n{2,}/).map(p => "<p>" + p.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[\s(])\*(.+?)\*(?=[\s).,;:]|$)/g,"$1<i>$2</i>").replace(/\n/g,"<br>") + "</p>").join("");
}

/* ------------------------------------------------------------ inkblot (Rorschach) generator */
function rng(seed){ let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
function drawBlot(cv, seed, color){
  const ctx = cv.getContext("2d"), W = cv.width, H = cv.height, r = rng(seed * 9301 + 49297);
  ctx.clearRect(0,0,W,H);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  if (color && color.startsWith("var(")) color = css(color.slice(4, -1));
  ctx.fillStyle = color || css("--blot") || "#2a2347";
  const blobs = 7 + Math.floor(r()*6);
  ctx.save(); ctx.beginPath();
  for (let i=0;i<blobs;i++){
    const x = W*0.5 - r()*W*0.36, y = H*(0.18 + r()*0.64), rad = Math.min(W,H)*(0.05 + r()*0.16);
    ctx.moveTo(x+rad,y); ctx.ellipse(x,y,rad*(0.8+r()*0.6),rad,r()*3,0,Math.PI*2);
    // drips
    if (r() > .6){ const dx = x - rad*0.6*r(), dy = y + rad*(1+r()); ctx.moveTo(dx+rad*.3,dy); ctx.arc(dx,dy,rad*.28,0,Math.PI*2); }
  }
  ctx.fill(); ctx.restore();
  // mirror left half onto right half
  ctx.save(); ctx.translate(W,0); ctx.scale(-1,1); ctx.drawImage(cv,0,0,W/2+1,H,0,0,W/2+1,H); ctx.restore();
}
function paintBlots(root = document){ root.querySelectorAll("canvas.blotc").forEach(c => drawBlot(c, +c.dataset.seed || 1, c.dataset.color)); }

/* ------------------------------------------------------------ data */
let DATA = null, Q = {}, EXAMS = {}, BLOCKS = {}, TOPICS = {};
const TOPIC_NAMES = {
  "sus-leg":"Legislação do SUS","sus-pol":"Políticas e redes do SUS","epi":"Epidemiologia e vigilância","etica":"Ética e documentos (CFP)",
  "hosp":"Psicologia hospitalar e da saúde","palia":"Morte, luto e cuidados paliativos","smental":"Saúde mental e RAPS","psicopat":"Psicopatologia e diagnóstico",
  "psican":"Psicanálise","teorias":"Abordagens e técnicas clínicas","desenv":"Desenvolvimento humano","aval":"Avaliação psicológica",
  "social":"Psicologia social, grupos e comunidade","org":"Psicologia organizacional e do trabalho","basic":"Fundamentos e história da Psicologia",
  "infancia":"Infância, adolescência e família","neuro":"Neuropsicologia","multi":"Equipe e interdisciplinaridade","outros":"Outros temas"
};
const CAUSES = [["conteudo","Não sabia o conteúdo"],["comando","Li errado o comando (INCORRETA/EXCETO)"],["confundi","Confundi conceitos/autores"],["pegadinha","Caí numa pegadinha"],["atencao","Falta de atenção"],["chute","Chutei"]];

/* ------------------------------------------------------------ state + persistence */
const PREF_DEF = { theme:"auto", read:"inter", ui:"inter", fs:1, lh:"normal", measure:"normal", contrast:false, motion:"auto", zen:false, oneTap:false, mixN:20, name:"", mode:"estudo", cover:true };
const blank = () => ({ v:1, upd:0, xp:0, ans:{}, notes:{}, journal:"", days:{}, badges:{}, goal:20, sims:[], lastExam:null, hints:{}, fc:{}, qcards:[], mycards:[], fcdays:{}, prefs:{ ...PREF_DEF } });
let S = blank();
function normalize(obj){ const n = Object.assign(blank(), obj || {}); n.prefs = Object.assign({ ...PREF_DEF }, (obj && obj.prefs) || {}); return n; }
function loadLocal(){ try { const raw = localStorage.getItem(LS_KEY); if (raw) S = normalize(JSON.parse(raw)); } catch(e) {} }
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e) {} }
let DB = null, UID = null, syncTimer = null, syncing = false, syncAgain = false, cloudOK = false;
function setSync(cls, title){ const el = $("#sync"); el.className = "sync " + cls; el.title = title; }
function touch(){ S.upd = Date.now(); saveLocal(); scheduleSync(); }
function scheduleSync(){ if (!DB || !UID) return; clearTimeout(syncTimer); syncTimer = setTimeout(pushCloud, 2500); }
async function pushCloud(){
  if (!DB || !UID) return;
  if (syncing){ syncAgain = true; return; }
  syncing = true; setSync("busy","Salvando na nuvem…");
  try {
    const { notes, journal, ...core } = S;
    await DB.doc("data/users/" + UID + "/progress").set(core);
    await DB.doc("data/users/" + UID + "/notes").set({ notes, journal, upd: S.upd });
    cloudOK = true; setSync("on","Progresso salvo na nuvem (" + new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}) + ")");
  } catch(e){
    setSync("", e && e.code === "invalid_argument" ? "Sem permissão para salvar na nuvem — salvo só neste aparelho" : "Não foi possível salvar na nuvem agora — salvo neste aparelho");
    if (e && e.code === "invalid_argument") DB = null;
  }
  syncing = false;
  if (syncAgain){ syncAgain = false; scheduleSync(); }
}
async function initCloud(){
  try {
    const [db, user] = await Promise.all([window.claude?.use?.("db"), window.claude?.use?.("user")]);
    if (!db || !user) { setSync("","Progresso salvo neste aparelho"); return; }
    const id = await user.id(); if (!id) { setSync("","Progresso salvo neste aparelho"); return; }
    DB = db; UID = id;
    const [p, n] = await Promise.all([db.doc("data/users/"+id+"/progress").get(), db.doc("data/users/"+id+"/notes").get()]);
    if (p.exists){
      const cloud = p.data(); const cn = n.exists ? n.data() : {};
      if ((cloud.upd||0) > (S.upd||0)){
        S = Object.assign(blank(), JSON.parse(JSON.stringify(cloud)), { notes: { ...(cn.notes||{}) }, journal: cn.journal || "" });
        saveLocal(); render(); toast("Progresso sincronizado da nuvem");
      } else if ((S.upd||0) > (cloud.upd||0)) pushCloud();
      setSync("on","Progresso salvo na nuvem");
    } else if (S.upd) pushCloud(); else setSync("on","Conectado — seu progresso será salvo na nuvem");
  } catch(e){ setSync("","Progresso salvo neste aparelho"); }
}

/* ------------------------------------------------------------ scoring, levels, streaks, SRS */
const LEVELS = [[0,"Caloura de Psicologia"],[120,"Estagiária de observação"],[350,"Estagiária clínica"],[700,"Monitora de Psicopatologia"],[1200,"Psicóloga com CRP ativo"],[1900,"Residente R1"],[2800,"Residente R2"],[4000,"Preceptora"],[5600,"Supervisora clínica"],[7600,"Referência técnica"],[10000,"Lenda da residência"]];
function levelOf(xp){ let i = 0; while (i+1 < LEVELS.length && xp >= LEVELS[i+1][0]) i++; const cur = LEVELS[i], nxt = LEVELS[i+1]; return { i, name: cur[1], from: cur[0], to: nxt ? nxt[0] : cur[0], next: nxt ? nxt[1] : null }; }
function streakDays(){ let n = 0, t = Date.now(); if (!S.days[today(t)]) t -= DAY; while (S.days[today(t)]) { n++; t -= DAY; } return n; }
const BOXES = [0, 1, 3, 7, 16, 35]; // days until next review per Leitner box
function rec(id){ return S.ans[id]; }
function lastOk(id){ const r = rec(id); return r && r.h.length ? r.h[r.h.length-1].ok : null; }
function isWrongNow(id){ return lastOk(id) === false; }
function due(id){ const r = rec(id); return r && r.due && r.due <= Date.now(); }
function addXP(n, why){ const before = levelOf(S.xp).i; S.xp += n; const after = levelOf(S.xp); if (after.i > before) setTimeout(() => celebrate("Novo nível: " + after.name, 5), 300); }
function recordAnswer(q, letter, opts = {}){
  const ok = letter === q.answer;
  const r = S.ans[q.id] || (S.ans[q.id] = { h: [], box: 0, due: 0 });
  const wasWrong = r.h.length && !r.h[r.h.length-1].ok;
  r.h.push({ a: letter, ok, t: Date.now(), hint: !!opts.hint, m: opts.mode || "estudo" });
  if (r.h.length > 12) r.h.splice(0, r.h.length - 12);
  if (ok){ r.box = Math.min(5, (r.box||0) + 1); r.due = Date.now() + BOXES[r.box] * DAY; if (wasWrong) r.fixed = (r.fixed||0) + 1; }
  else { r.box = 1; r.due = Date.now() + DAY; }
  const d = today(); S.days[d] = (S.days[d]||0) + 1;
  let gain = ok ? (opts.hint ? 6 : 10) : 2;
  S.run = ok ? (S.run||0) + 1 : 0;
  if (ok && S.run && S.run % 5 === 0) gain += 5;
  if (ok && wasWrong) gain += 4;
  if (S.days[d] === S.goal) { gain += 30; setTimeout(() => celebrate("Meta do dia batida! +30 XP", 11), 200); }
  addXP(gain);
  checkBadges();
  touch();
  return { ok, gain };
}

/* ------------------------------------------------------------ badges */
const BADGES = [
  ["first","Primeira sessão","Respondeu a primeira questão.", s => answeredCount() >= 1],
  ["run10","Associação livre","10 acertos seguidos.", s => (s.bestRun||0) >= 10],
  ["day50","Plantão puxado","50 questões em um só dia.", s => Object.values(s.days).some(n => n >= 50)],
  ["streak7","Setting estável","7 dias seguidos estudando.", s => streakDays() >= 7],
  ["exam","Caderno fechado","Respondeu todas as questões de uma prova.", s => DATA && DATA.exams.some(e => examQs(e.id).length && examQs(e.id).every(q => rec(q.id)))],
  ["sus","Lei 8.080 na ponta da língua","80% de acerto em SUS (mín. 40 respondidas).", s => { const a = areaStats("sus"); return a.n >= 40 && a.ok / a.n >= .8; }],
  ["psi","Escuta afinada","80% de acerto em Psicologia (mín. 60 respondidas).", s => { const a = areaStats("psi"); return a.n >= 60 && a.ok / a.n >= .8; }],
  ["fixed20","Elaboração","Acertou 20 questões que já tinha errado.", s => Object.values(s.ans).reduce((t,r) => t + (r.fixed||0), 0) >= 20],
  ["notes10","Prontuário em dia","Fez 10 anotações em questões.", s => Object.values(s.notes).filter(t => t && t.trim()).length >= 10],
  ["sim","Simulado completo","Terminou um simulado cronometrado.", s => s.sims.length >= 1],
  ["blocks","Rede ampliada","Respondeu ao menos 10 questões de cada bloco.", s => DATA && Object.keys(BLOCKS).every(b => blockQs(b).filter(q => rec(q.id)).length >= 10)],
  ["q500","Quinhentas","500 questões respondidas.", s => answeredCount() >= 500],
];
function checkBadges(){
  S.bestRun = Math.max(S.bestRun||0, S.run||0);
  BADGES.forEach(([id, name, , test], i) => { if (!S.badges[id] && test(S)) { S.badges[id] = Date.now(); addXP(25); setTimeout(() => celebrate("Conquista: " + name + " (+25 XP)", 20 + i), 700); } });
}

/* ------------------------------------------------------------ selectors */
const examQs = id => DATA.questions.filter(q => q.exam === id);
const blockQs = b => DATA.questions.filter(q => EXAMS[q.exam].block === b);
const answeredCount = () => Object.keys(S.ans).filter(id => Q[id]).length;
function areaStats(area){ let n=0, ok=0; for (const [id,r] of Object.entries(S.ans)) { const q = Q[id]; if (!q || q.area !== area || !r.h.length) continue; n++; if (r.h[r.h.length-1].ok) ok++; } return { n, ok }; }
function statsFor(qs){ let ok=0, bad=0; qs.forEach(q => { const v = lastOk(q.id); if (v === true) ok++; else if (v === false) bad++; }); return { ok, bad, n: qs.length, done: ok + bad }; }
const playable = qs => qs.filter(q => q.answer !== "NULA");

/* ------------------------------------------------------------ navigation */
const NAV = [
  ["inicio","Início",'<path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/>'],
  ["provas","Provas",'<path d="M5 3h10l4 4v14H5z"/><path d="M15 3v4h4M8 12h8M8 16h6"/>'],
  ["resumos","Resumos",'<circle cx="12" cy="12" r="2.5"/><circle cx="4.5" cy="5.5" r="2"/><circle cx="19.5" cy="5.5" r="2"/><circle cx="4.5" cy="18.5" r="2"/><circle cx="19.5" cy="18.5" r="2"/><path d="M10 10.5L6 7M14 10.5L18 7M10 13.5L6 17M14 13.5L18 17"/>'],

let cutMode = false;
function bindQuiz(){
  if (!RUN) return;
  const id = RUN.ids[RUN.i], q = Q[id];
  document.querySelectorAll("[data-opt]").forEach(b => b.onclick = () => {
    if (RUN.done[id] && RUN.mode !== "simulado") return;
    const L = b.dataset.opt;
    if (cutMode){ RUN.cut[id] = RUN.cut[id] || {}; RUN.cut[id][L] = !RUN.cut[id][L]; render(); return; }
    RUN.sel[id] = L;
    if (RUN.mode === "simulado"){ RUN.done[id] = true; }
    if (RUN.mode !== "simulado" && S.prefs.oneTap) { doConfirm(); return; }
    render();
    const again = document.querySelector(`[data-opt="${L}"]`); if (again) again.focus({ preventScroll: true });
  });
  const doConfirm = () => {
    const L = RUN.sel[id]; if (!L || RUN.done[id] && RUN.mode !== "simulado") return;
    RUN.done[id] = true;
    if (RUN.mode !== "simulado"){
      if (q.answer !== "NULA"){ const res = recordAnswer(q, L, { hint: RUN.hint[id], mode: RUN.mode }); toastXP(res); }
    }
    cutMode = false; render();
    if (RUN.mode !== "simulado") { const ex = document.querySelector(".expl"); if (ex) ex.scrollIntoView({behavior: S.prefs.motion === "off" ? "auto" : "smooth", block:"nearest"}); } else if (RUN.i + 1 < RUN.ids.length) { RUN.i++; render(); }
  };
  const c = $("#qconfirm"); if (c) c.onclick = doConfirm;
  const fig = document.querySelector(".fig"); if (fig) fig.onclick = () => fig.classList.toggle("zoom");
  const h = $("#qhint"); if (h) h.onclick = () => { RUN.hint[id] = true; render(); };
  const cu = $("#qcut"); if (cu) { cu.setAttribute("aria-pressed", cutMode); if (cutMode) cu.classList.add("pri"); cu.onclick = () => { cutMode = !cutMode; render(); toast(cutMode ? "Toque nas alternativas pra riscar" : "Modo riscar desligado"); }; }
  const qc = $("#qcard"); if (qc) qc.onclick = () => { const k = S.qcards.indexOf(id); if (k < 0) { S.qcards.push(id); toast("Adicionada aos flashcards (Resumos › Flashcards)"); } else { S.qcards.splice(k, 1); toast("Removida dos flashcards"); } touch(); render(); };
  document.querySelectorAll("#main [data-rterm]").forEach(b => b.onclick = () => runTerm(b.dataset.rterm));
  $("#qfav").onclick = () => { const r = S.ans[id] || (S.ans[id] = { h: [], box: 0, due: 0 }); r.fav = !r.fav; touch(); render(); };
  $("#qprev").onclick = () => { RUN.i--; cutMode = false; render(); window.scrollTo({top:0}); };
  $("#qnext").onclick = () => { if (RUN.i + 1 < RUN.ids.length){ RUN.i++; cutMode = false; render(); window.scrollTo({top:0}); } else if (RUN.mode === "simulado") finishSim(); else finishStudy(); };
  const f = $("#qfinish"); if (f) f.onclick = () => confirmBox("Entregar o simulado agora? Questões em branco contam como erro.", "Entregar", finishSim);
  $("#qexit").onclick = () => { if (RUN.mode === "simulado" && Object.keys(RUN.done).length) confirmBox("Sair do simulado? As respostas marcadas não serão corrigidas.", "Sair", () => { RUN = null; go("provas"); }); else { const b = RUN.exam ? EXAMS[RUN.exam].block : null; RUN = null; if (b) { CUR_BLOCK = b; go("bloco"); } else go("inicio"); } };
  document.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => { RUN.i = +b.dataset.jump; cutMode = false; render(); window.scrollTo({top:0}); });
  document.querySelectorAll("[data-cause]").forEach(b => b.onclick = () => { const r = S.ans[id]; if (!r) return; r.cause = r.cause === b.dataset.cause ? "" : b.dataset.cause; const last = r.h[r.h.length-1]; if (last) last.c = r.cause; touch(); render(); });
  const n = $("#qnote"); let nt = null;
  n.oninput = () => { clearTimeout(nt); nt = setTimeout(() => { const v = n.value; if (v.trim()) S.notes[id] = v; else delete S.notes[id]; checkBadges(); touch(); }, 700); };
}
function finishStudy(){
  const ids = RUN.ids, done = ids.filter(id => RUN.done[id] && Q[id].answer !== "NULA");
  const ok = done.filter(id => RUN.sel[id] === Q[id].answer).length;
  RESULT = { title: RUN.title, ids, sel: RUN.sel, ok, n: done.length, time: Date.now() - RUN.start, sim: false };
  RUN = null; VIEW = "resultado"; render(); window.scrollTo({top:0});
}
let RESULT = null;
function finishSim(){
  clearInterval(tickT);
  const ids = RUN.ids, valid = ids.filter(id => Q[id].answer !== "NULA");
  let ok = 0;
  valid.forEach(id => { const L = RUN.sel[id]; if (L) { const res = recordAnswer(Q[id], L, { mode: "simulado" }); if (res.ok) ok++; } });
  const sim = { t: Date.now(), title: RUN.title, ok, n: valid.length, time: Date.now() - RUN.start };
  S.sims.push(sim); if (S.sims.length > 40) S.sims.shift();
  addXP(50); checkBadges(); touch();
  RESULT = { title: RUN.title, ids, sel: RUN.sel, ok, n: valid.length, time: sim.time, sim: true };
  RUN = null; VIEW = "resultado"; render(); window.scrollTo({top:0});
}
function vResultado(){

function barRow(label, ok, n){ const p = n ? ok / n : 0; return `<div class="bar"><span class="lab" title="${esc(label)}">${esc(label)}</span><div class="meter"><i class="m-ok" style="width:${p*100}%"></i><i class="m-bad" style="width:${(1-p)*100}%"></i></div><span class="val">${ok}/${n} · ${Math.round(p*100)}%</span></div>`; }

      <select class="sel" id="ef-block" aria-label="Bloco"><option value="">Todos os blocos</option>${Object.entries(BLOCKS).map(([k,b]) => `<option value="${k}" ${ERR_FILTER.block===k?"selected":""}>${esc(b.name)}</option>`).join("")}</select>
      <select class="sel" id="ef-topic" aria-label="Tema"><option value="">Todos os temas</option>${Object.entries(TOPIC_NAMES).map(([k,l]) => `<option value="${k}" ${ERR_FILTER.topic===k?"selected":""}>${esc(l)}</option>`).join("")}</select>

  </section>`;

function bindErros(){

  const ABBR = /(?:\b(?:art|arts|inc|n|nº|p|pp|ed|al|Res|Dr|Dra|Sr|Sra|ex|cap|vol|fig|Prof|Profa|etc|aprox|séc|LC|EC)|\b[A-Z]|§ ?\d+)$/;

  if (cut < 0 || cut >= s.length - 2) return [s, ""];
  return [s.slice(0, cut).trim(), s.slice(cut).trim()];

  else if (t.id === "redoWrong"){ const R = RESULT; startRun(R.ids.filter(id => Q[id].answer !== "NULA" && R.sel[id] !== Q[id].answer), { mode: "erros", title: "Refazendo erros" }); }
  else if (t.id === "revRun"){ startRun(shuffle(DATA.questions.filter(q => due(q.id)).map(q => q.id)), { mode: "revisao", title: "Revisão do dia" }); }
  else if (t.id === "favRun"){ startRun(DATA.questions.filter(q => rec(q.id) && rec(q.id).fav).map(q => q.id), { mode: "estudo", title: "Favoritas" }); }
});
function mix(qs, n){ const unseen = shuffle(qs.filter(q => !rec(q.id))), seen = shuffle(qs.filter(q => rec(q.id))); return [...unseen, ...seen].slice(0, n).map(q => q.id); }

/* ------------------------------------------------------------ toasts & dialogs */
let toastT = null;
function toast(msg, seed){
  const old = $(".toast"); if (old) old.remove();
  const d = document.createElement("div"); d.className = "toast"; d.setAttribute("role","status");
  d.innerHTML = (seed ? `<canvas class="blotc" width="68" height="52" data-seed="${seed}" data-color="#ffffff"></canvas>` : "") + `<span>${esc(msg)}</span>`;
  document.body.appendChild(d); paintBlots(d);
  clearTimeout(toastT); toastT = setTimeout(() => d.remove(), 2600);
}
function toastXP(res){ if (S.prefs.zen) toast(res.ok ? "Certa!" : "Errou — veja a explicação"); else toast(res.ok ? `Certa! +${res.gain} XP` : `Errou. +${res.gain} XP pelo esforço — veja a explicação`); }
function celebrate(msg, seed){ if (!S.prefs.zen || /Meta do dia/.test(msg)) toast(msg, seed); renderHeader(); }
function confirmBox(msg, okLabel, fn, o = {}){
  const prev = document.activeElement;
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="card" role="alertdialog" aria-modal="true" aria-labelledby="mdl-t"><div id="mdl-t" style="font-weight:600">${esc(msg)}</div>${o.detail ? `<div class="small muted">${esc(o.detail)}</div>` : ""}${o.typed ? `<label class="small" for="mdl-in">Para confirmar, digite <b>${esc(o.typed)}</b>:</label><input id="mdl-in" class="inp" autocomplete="off" autocapitalize="characters" spellcheck="false">` : ""}<div class="row" style="justify-content:flex-end"><button class="btn" data-x>Cancelar</button><button class="btn ${o.danger ? "danger fill" : "pri"}" data-y ${o.typed ? "disabled" : ""}>${esc(okLabel)}</button></div></div>`;
  document.body.appendChild(m);
  const close = () => { m.remove(); document.removeEventListener("keydown", onKey, true); if (prev && prev.focus) prev.focus({ preventScroll: true }); };
  const onKey = e => { if (e.key === "Escape") { e.stopPropagation(); close(); } };
  document.addEventListener("keydown", onKey, true);
  const y = m.querySelector("[data-y]"), inp = m.querySelector("#mdl-in");
  m.querySelector("[data-x]").onclick = close;
  y.onclick = () => { close(); fn(); };
  if (inp) { inp.oninput = () => { y.disabled = inp.value.trim().toUpperCase() !== o.typed.toUpperCase(); }; inp.focus(); } else (o.danger ? m.querySelector("[data-x]") : y).focus();
  m.onclick = e => { if (e.target === m) close(); };
}

/* ------------------------------------------------------------ boot */
async function boot(){
  loadLocal();
  applyPrefs();
  drawBlot($("#logo"), 42);
  try {
    const qd = window.PSI_QUESTOES, xd = window.PSI_EXPLICACOES || {};
    if (!qd) throw new Error("sem dados");
    DATA = qd; BLOCKS = qd.blocks;
    qd.exams.forEach(e => EXAMS[e.id] = e);
    qd.questions.forEach(q => { q.x = xd[q.id] || {}; if (q.x.t) q.topic = q.x.t; if (!q.topic) q.topic = q.area === "sus" ? "sus-leg" : "outros"; if (q.x.fix) Object.assign(q, q.x.fix); Q[q.id] = q; });
  } catch(e){ $("#main").innerHTML = `<div class="card empty">Não foi possível carregar as questões. Recarregue a página.</div>`; return; }
  const h = (location.hash || "").slice(1);
  if (["inicio","provas","erros","revisao","notas","stats","ajustes","resumos"].includes(h)) VIEW = h;
  render();
  setSync("on","Progresso salvo neste navegador");
}
boot();
</script>
